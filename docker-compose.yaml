services:
  postgres:
    image: postgres:16-alpine
    container_name: markethub-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-markethub}
      POSTGRES_USER: ${POSTGRES_USER:-markethub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-markethub_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: markethub-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password}
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    container_name: markethub-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data

  app:
    build: .
    container_name: markethub-app
    depends_on:
      - postgres
      - redis
      - minio
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker

      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${POSTGRES_DB:-markethub}
      DB_USERNAME: ${POSTGRES_USER:-markethub_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-markethub_password}

      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-redis_password}

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}

      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}

      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-86400000}

      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@markethub.local}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin12345}

      APP_PRODUCT_IMAGES_MAX_FILE_SIZE_BYTES: ${APP_PRODUCT_IMAGES_MAX_FILE_SIZE_BYTES:-5242880}
      APP_PRODUCT_IMAGES_LIMIT: ${APP_PRODUCT_IMAGES_LIMIT:-5}
      APP_IMAGES_ALLOWED_TYPES: ${APP_IMAGES_ALLOWED_TYPES:-image/jpeg,image/png,image/webp}

      APP_MINIO_ENDPOINT: http://minio:9000
      APP_MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      APP_MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      APP_MINIO_BUCKET: ${APP_MINIO_BUCKET:-markethub-images}

      REQUEST_LIMIT: ${REQUEST_LIMIT:-10}
      WINDOW_SIZE: ${WINDOW_SIZE:-1m}

volumes:
  postgres-data:
  minio-data:
